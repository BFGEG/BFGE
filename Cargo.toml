[package]
name = "BFGE"
version = "0.1.0"
edition = "2024"

[features]
stress-benchmark = []

[[bin]]
name = "bfge-stress"
path = "src/bin/bfge_stress.rs"
required-features = ["stress-benchmark"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
base64 = "0.22"
glam = "0.30"
gltf = { version = "1.4", default-features = false, features = ["utils"] }
percent-encoding = "2"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tobj = { version = "4", default-features = false }
wgpu = "30"
winit = "0.30"

[dev-dependencies]
tempfile = "3"
